# InkMarkdown CI — 钉死工具链的 iOS Simulator 测试门禁。
#
# 设计原则（与 Alamofire / Kingfisher / pointfreeco TCA 一致）：
# - 不读开发者本机 Xcode；只在 GitHub Hosted runner 上跑。
# - 不“选最新 Xcode”；路径与模拟器 OS 写死在 env 里。
# - 合并以本 workflow 绿灯为准；本地可用更新的 Xcode 开发，但勿用本机结果否定 CI。
#
# 升级工具链时：改下方 env → 对照
# https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
# → 本地用同版本验证 → 更新 docs/contributor-guide/07-ci-and-toolchain-pitfalls.md
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ---- 钉死的权威工具链（改这里 = 升级 CI）----
  # runner-images macos-26 (image 20260630.0213.1 及同代)：
  #   Xcode 26.6 → /Applications/Xcode_26.6.app (Build 17F113)
  #   iOS Simulator 26.5 含 iPhone 17 Pro
  RUNNER_OS_IMAGE: macos-26
  XCODE_VERSION: "26.6"
  XCODE_APP: /Applications/Xcode_26.6.app
  XCODE_BUILD: "17F113"
  # destination 必须同时钉 name + OS，避免同名设备跨 runtime 漂移
  IOS_SIM_NAME: iPhone 17 Pro
  IOS_SIM_OS: "26.5"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  package-tests:
    name: Package / ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core
            slug: core
            timeout: 30
            filters: >-
              -only-testing:InkMarkdownTests
              -only-testing:InkMarkdownCoreContractTests
              -only-testing:ExampleAppPolicyTests
          - name: SwiftUI adapter
            slug: swiftui
            timeout: 30
            filters: -only-testing:InkMarkdownSwiftUITests
          - name: Addon contracts
            slug: addon-contracts
            timeout: 30
            filters: >-
              -only-testing:InkMarkdownAddonContractTests
              -only-testing:InkMarkdownLaTeXTests
          - name: Mermaid integration
            slug: mermaid
            timeout: 45
            filters: -only-testing:InkMarkdownMermaidTests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned iOS toolchain
        id: ios
        uses: ./.github/actions/setup-ios
        with:
          xcode-app: ${{ env.XCODE_APP }}
          xcode-version: ${{ env.XCODE_VERSION }}
          xcode-build: ${{ env.XCODE_BUILD }}
          simulator-name: ${{ env.IOS_SIM_NAME }}
          simulator-os: ${{ env.IOS_SIM_OS }}

      - name: Verify package manifest
        run: swift package dump-package > package-manifest.json

      - name: Resolve package dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -scheme InkMarkdown-Package \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Test ${{ matrix.name }}
        env:
          DESTINATION: ${{ steps.ios.outputs.destination }}
          TEST_FILTERS: ${{ matrix.filters }}
        run: |
          set -euo pipefail
          read -r -a test_filter_args <<< "${TEST_FILTERS}"
          set -o pipefail
          xcodebuild test \
            -scheme InkMarkdown-Package \
            -destination "${DESTINATION}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -resultBundlePath TestResults.xcresult \
            "${test_filter_args[@]}" \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-test.log

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.slug }}-failure
          path: |
            xcodebuild-test.log
            TestResults.xcresult
            package-manifest.json
          if-no-files-found: ignore

  example-app:
    name: ExampleApp / ${{ matrix.configuration }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned iOS toolchain
        id: ios
        uses: ./.github/actions/setup-ios
        with:
          xcode-app: ${{ env.XCODE_APP }}
          xcode-version: ${{ env.XCODE_VERSION }}
          xcode-build: ${{ env.XCODE_BUILD }}
          simulator-name: ${{ env.IOS_SIM_NAME }}
          simulator-os: ${{ env.IOS_SIM_OS }}

      - name: Resolve ExampleApp dependencies
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project ExampleApp/ExampleApp.xcodeproj \
            -scheme ExampleApp \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build ExampleApp
        env:
          DESTINATION: ${{ steps.ios.outputs.destination }}
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild build \
            -project ExampleApp/ExampleApp.xcodeproj \
            -scheme ExampleApp \
            -configuration "${{ matrix.configuration }}" \
            -destination "${DESTINATION}" \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild-example.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-${{ matrix.configuration }}-failure
          path: xcodebuild-example.log
          if-no-files-found: ignore
